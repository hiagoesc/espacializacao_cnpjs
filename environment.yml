# Ambiente Anaconda do projeto. Criar: conda env create -f environment.yml | Ativar: conda activate espacializacao_cnpjs
name: espacializacao_cnpjs
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas
  - numpy
  - geopandas
  - pyogrio
  - shapely>=2.0
  - pyproj
  - pyarrow
  - openpyxl
  - xlsxwriter
  - pyyaml
  - rapidfuzz
  - requests
  - jupyter
  - nbconvert
